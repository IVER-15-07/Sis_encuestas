server.address=0.0.0.0
server.port=${PORT:8282}

# La conexión se entrega por variables de entorno en Docker o en el proveedor cloud.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forzar el dialecto de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Control de tablas (gestionadas desde Supabase)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Inserciones rápidas por lotes
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Capacidad para subir los archivos Excel
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB